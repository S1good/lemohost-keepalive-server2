name: Keep Server Alive

on:
  repository_dispatch:
    types: [keepalive]
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  extend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install requests Pillow pytesseract easyocr
      - run: python keepalive.py
        env:
          LEMO_SESSION_COOKIE: ${{ secrets.LEMO_SESSION_COOKIE }}
